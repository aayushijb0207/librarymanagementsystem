<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Issue Book</title>
</head>
<body>
    <h1>Issue a Book</h1>

    {% if error %}
        <p style="color: red;">{{ error }}</p>
    {% endif %}

    {% if books and students %}
    <form method="POST" action="{{ url_for('issue_book') }}">
        <label>Select Book:</label>
        <select name="book_id" required>
            {% for book in books %}
            <option value="{{ book.id }}">
                {{ book.title }} — {{ book.author }} (Available: {{ book.quantity }})
            </option>
            {% endfor %}
        </select>
        <br><br>

        <label>Select Student:</label>
        <select name="student_id" required>
            {% for student in students %}
            <option value="{{ student.id }}">
                {{ student.name }} — {{ student.email }}
            </option>
            {% endfor %}
        </select>
        <br><br>

        <label>Due Date:</label>
        <input type="date" name="due_date" min="{{ today }}" required>
        <br><br>

        <button type="submit">Issue Book</button>
    </form>
    {% else %}
        <p>You need at least one available book and one registered student before issuing a book.</p>
    {% endif %}

    <p><a href="{{ url_for('issued_books') }}">View Issued Books</a></p>
    <p><a href="{{ url_for('dashboard') }}">Back to Dashboard</a></p>
</body>
</html>
